# Nom de l'application
spring.application.name=learn2slither-backend

# Port HTTP du backend
server.port=${APP_PORT:8080}

# Configuration de la connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:learn2slither}
spring.datasource.username=${POSTGRES_USER:learn2slither}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver